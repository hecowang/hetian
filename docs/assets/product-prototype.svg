  <g transform="translate(28 105)"><rect x="105" y="92" width="158" height="148" fill="#735848"/><path d="M82 98L184 30L286 98Z" fill="#55453e"/><circle cx="60" cy="74" r="47" fill="#54754e"/></g>
  <g transform="translate(424 105)"><rect x="105" y="92" width="158" height="148" fill="#735848"/><path d="M82 98L184 30L286 98Z" fill="#55453e"/><circle cx="60" cy="74" r="41" fill="#887b48"/></g>
