  <rect class="card" x="548" y="82" rx="12" width="248" height="236"/><text class="muted s" x="572" y="112">任务状态</text><text class="ink h2" x="572" y="145">已安全返航</text><text class="ink t" x="572" y="184">照片　5 / 5</text><text class="ink t" x="572" y="216">电量　43%</text><text class="ink t" x="572" y="248">用时　12分38秒</text><rect class="accent" x="572" y="274" rx="8" width="196" height="30"/><text class="white nav" x="621" y="295">查看本次记录</text>
