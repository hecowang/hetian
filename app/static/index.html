<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>故乡守望</title>
  <style>
    :root{--ink:#213028;--muted:#66736b;--paper:#f4f0e6;--green:#476451;--line:#d8d1c2}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,sans-serif}
    header{min-height:44vh;padding:9vh max(6vw,24px);display:grid;align-content:end;background:linear-gradient(120deg,#d7dfd1,#efe6d4)}
    h1{font:700 clamp(42px,7vw,90px)/1.05 Georgia,serif;margin:0 0 18px;letter-spacing:-.04em} .tagline{font-size:clamp(18px,2vw,28px);max-width:760px}
    main{max-width:1180px;margin:auto;padding:54px 24px} .digest{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:26px 0;margin-bottom:42px}
    .digest h2{font:600 28px Georgia,serif;margin:0 0 8px}.muted{color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{background:#fff;border-radius:3px;overflow:hidden;box-shadow:0 7px 24px #28362c12}
    .card img{width:100%;height:220px;object-fit:cover;background:#d9ddda}.meta{padding:18px}.meta h3{margin:0 0 5px;font:600 22px Georgia,serif}.empty{padding:70px 10px;text-align:center;color:var(--muted)}
  </style>
</head>
<body>
  <header><div><div class="muted">HOMETOWN KEEPER · 故乡守望</div><h1>故乡不是一张旧照片。</h1><div class="tagline">为长期在外生活的人，保存一个持续变化的故乡。</div></div></header>
  <main><section class="digest"><div class="muted">故乡日报</div><h2 id="headline">正在读取今天的故乡……</h2><div id="summary"></div><ul id="highlights"></ul></section><section><div class="muted">时间轴 · 最新记录</div><div class="grid" id="timeline"></div></section></main>
  <script>
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function load(){
      const [d,t]=await Promise.all([fetch('/api/digest/latest').then(r=>r.json()),fetch('/api/timeline').then(r=>r.json())]);
      headline.textContent=d.headline; summary.textContent=d.summary; highlights.innerHTML=d.highlights.map(x=>`<li>${esc(x)}</li>`).join('');
      timeline.innerHTML=t.length?t.map(x=>`<article class="card"><img src="${encodeURI(x.media_url)}" alt="${esc(x.place_name)}"><div class="meta"><h3>${esc(x.place_name)}</h3><div class="muted">${new Date(x.captured_at).toLocaleString('zh-CN')} · ${x.altitude_m}m</div><div>${esc(x.note||'固定观察点影像')}</div></div></article>`).join(''):'<div class="empty">还没有记录。运行巡飞模拟器，留下故乡的第一帧。</div>';
    } load().catch(()=>headline.textContent='暂时无法读取故乡记录');
  </script>
</body></html>
